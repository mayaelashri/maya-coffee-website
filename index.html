<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Coffee Shop</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar custom-nav px-4">
  <span class="navbar-brand text-white"> Brew Haven</span>

  <div class="d-flex gap-3">
    <a class="nav-link text-white">Home</a>
    <a class="nav-link text-white">Menu</a>
    <a class="nav-link text-white">Contact</a>
  </div>
</nav>

<div id="carouselExample" class="carousel slide" data-bs-ride="carousel">
  <div class="carousel-inner">

    <div class="carousel-item active">
      <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93" class="d-block w-100">
    </div>

    <div class="carousel-item">
      <img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085" class="d-block w-100">
    </div>

    <div class="carousel-item">
      <img src="https://images.unsplash.com/photo-1461023058943-07fcbe16d735" class="d-block w-100">
    </div>

  </div>

  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
    <span class="carousel-control-prev-icon"></span>
  </button>

  <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
    <span class="carousel-control-next-icon"></span>
  </button>
</div>

<section class="hero text-center">
  <div class="container">
    <div class="hero-text mx-auto">

      <h1 id="title">Welcome to Brew Heaven! </h1>
      <p id="text">Best coffee in town </p>

      <button class="btn btn-brown" onclick="changeText()">Change Text</button>
      <button class="btn btn-dark" onclick="changeLayout()">Change Layout</button>

      <button class="btn btn-success" data-bs-toggle="offcanvas" data-bs-target="#menu">
        Open Menu
      </button>

    </div>
  </div>
</section>

<section class="about">
  <div id="boxes" class="container">
    <div class="box"> Latte</div>
    <div class="box"> Mocha</div>
    <div class="box"> Cold Brew</div>
  </div>
</section>

<div class="offcanvas offcanvas-start" id="menu">
  <div class="offcanvas-header">
    <h5>Coffee Menu </h5>
    <button class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>

  <div class="offcanvas-body">
    <div class="menu-item"><span> Latte</span><span class="price">100 EGP</span></div>
    <div class="menu-item"><span> Mocha</span><span class="price">120 EGP</span></div>
    <div class="menu-item"><span> Spanish Latte</span><span class="price">140 EGP</span></div>
    <div class="menu-item"><span> Cold Brew</span><span class="price">80 EGP</span></div>
  </div>
</div>

<footer>
  <p>Made with Love </p>
</footer>

<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
